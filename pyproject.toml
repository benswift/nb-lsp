[project]
name = "nb-lsp"
version = "0.1.0"
description = "LSP server for nb note-taking tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ben Swift", email = "ben@benswift.me" }]
keywords = ["lsp", "language-server", "nb", "notes", "markdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
    "Typing :: Typed",
]
dependencies = [
    "pygls>=1.3.0",
    "lsprotocol>=2023.0.0",
]

[project.urls]
Homepage = "https://github.com/benswift/nb-lsp"
Repository = "https://github.com/benswift/nb-lsp"
Issues = "https://github.com/benswift/nb-lsp/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ty>=0.0.1a10",
]

[project.scripts]
nb-lsp = "nb_lsp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nb_lsp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
